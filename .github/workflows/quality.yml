name: Typecheck, lint, test, and build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Existing violations are recorded in eslint-suppressions.json; only new
      # ones fail. After fixing some, run `npx eslint . --prune-suppressions`.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # * The production tree must be clean of high/critical advisories.
      # * The full tree can't be hardened today: CVE-2026-93687 affects every
      #   published version of braces (shadcn -> ts-morph -> fast-glob ->
      #   micromatch), it ships in no runtime request, and `audit fix --force`
      #   would downgrade shadcn. Reported but not gating until a fix exists.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high
        continue-on-error: true

  # Sign-in, a pupil's exam, a parent's results and fees, in a real browser
  # against fake backends (e2e/mock-api.mjs).
  e2e:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
