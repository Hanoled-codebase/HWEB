name: Typecheck, lint, test, and build

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Existing violations are recorded in eslint-suppressions.json; only new
      # ones fail. After fixing some, run `npx eslint . --prune-suppressions`.
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
